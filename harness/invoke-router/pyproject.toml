[project]
name = "invoke-router"
version = "0.1.0"
description = "Local invoke router: sends InvokeAgentRuntime calls to the local agent containers; everything else goes to Floci."
requires-python = ">=3.11"
# Reuses the SDK (logging); httpx2 is the HTTP client the approved openai client already uses.
dependencies = ["ent-agent-sdk", "httpx2~=2.13.1"]

[project.scripts]
invoke-router = "invoke_router.__main__:main"

[tool.uv.sources]
ent-agent-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoke_router"]
